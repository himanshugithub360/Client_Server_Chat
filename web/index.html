<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Room</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eceef2;
    --text: #1b1f27;
    --muted: #667085;
    --border: #dde1e8;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --own: #4f46e5;
    --own-text: #ffffff;
    --other: #ffffff;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --user-l: 38%;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --surface: #181c25; --surface-2: #222733; --text: #e8eaf0; --muted: #98a2b3;
      --border: #2a3040; --accent: #7c83ff; --accent-text: #0f1218; --own: #4f46e5; --own-text: #fff;
      --other: #222733; --user-l: 72%; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --surface: #181c25; --surface-2: #222733; --text: #e8eaf0; --muted: #98a2b3;
    --border: #2a3040; --accent: #7c83ff; --accent-text: #0f1218; --own: #4f46e5; --own-text: #fff;
    --other: #222733; --user-l: 72%; --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- login ---------- */
  .login {
    min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px; box-shadow: var(--shadow);
  }
  .logo {
    width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-size: 24px; margin-bottom: 18px;
  }
  .card h1 { font-size: 22px; margin: 0 0 4px; }
  .card p { margin: 0 0 22px; color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); outline: none;
  }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .primary {
    width: 100%; margin-top: 14px; padding: 11px 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); font-weight: 600;
  }
  .primary:disabled { opacity: .55; cursor: default; }
  .error { color: var(--bad); font-size: 13px; min-height: 20px; margin: 10px 0 0; }

  /* ---------- app ---------- */
  .app { height: 100%; display: grid; grid-template-columns: 260px 1fr; }
  .side {
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side header { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 10px; font-size: 17px; margin: 0; }
  .status { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--good); }
  .dot.wait { background: var(--warn); animation: pulse 1.2s infinite; }
  .dot.off { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  .side h2 {
    margin: 0; padding: 16px 18px 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); display: flex; justify-content: space-between;
  }
  .users { list-style: none; margin: 0; padding: 0 10px; overflow-y: auto; flex: 1; }
  .users li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
    font-weight: 700; font-size: 13px; color: #fff; background: hsl(var(--h) 55% 45%);
  }
  .users .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .users .you { color: var(--muted); font-size: 12px; }
  .side footer { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .ghost {
    flex: 1; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border); background: transparent;
  }
  .ghost:hover { background: var(--surface-2); }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar {
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .banner {
    padding: 9px 16px; text-align: center; font-size: 13px; background: color-mix(in srgb, var(--warn) 18%, var(--surface));
    border-bottom: 1px solid var(--border);
  }
  .banner.bad { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
  .banner button { margin-left: 8px; padding: 3px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); }

  .messages { flex: 1; overflow-y: auto; padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 4px; }
  .sys { align-self: center; max-width: 90%; color: var(--muted); font-size: 12.5px; text-align: center; padding: 6px 0; overflow-wrap: anywhere; }
  .row { display: flex; flex-direction: column; max-width: min(640px, 82%); }
  .row.own { align-self: flex-end; align-items: flex-end; }
  .row.first { margin-top: 10px; }
  .meta { font-size: 12px; color: var(--muted); margin: 0 6px 3px; display: flex; gap: 8px; align-items: baseline; }
  .meta b { color: hsl(var(--h) 60% var(--user-l)); font-weight: 700; }
  .row.server .meta b { color: var(--accent); }
  .bubble {
    padding: 8px 13px; border-radius: 16px; background: var(--other); border: 1px solid var(--border);
    white-space: pre-wrap; overflow-wrap: anywhere; border-top-left-radius: 5px;
  }
  .row.own .bubble { background: var(--own); color: var(--own-text); border-color: transparent; border-top-left-radius: 16px; border-top-right-radius: 5px; }
  .row.server .bubble { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .empty { margin: auto; text-align: center; color: var(--muted); }

  .composer { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); }
  .composer form {
    display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 6px 6px 6px 14px;
  }
  .composer form:focus-within { border-color: var(--accent); }
  .composer input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 8px 0; }
  .send {
    border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text);
    padding: 9px 16px; font-weight: 600;
  }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { margin: 6px 4px 0; font-size: 12px; color: var(--muted); }
  kbd { background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; font-size: 11.5px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 5; transform: translateX(-100%); transition: transform .2s; }
    .app.open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.4); }
    .topbar { display: flex; }
    .messages { padding: 14px 12px 6px; }
    .row { max-width: 90%; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- ============ Login ============ -->
<main class="login" id="login">
  <form class="card" id="loginForm" autocomplete="off">
    <div class="logo" aria-hidden="true">💬</div>
    <h1>Join the chat</h1>
    <p>Pick any name you like. Others in the room will see it next to your messages.</p>
    <label for="nameInput">Your name</label>
    <input class="field" id="nameInput" maxlength="20" placeholder="e.g. Maria" required autofocus>
    <button class="primary" id="joinBtn" type="submit">Join</button>
    <p class="error" id="loginError" role="alert"></p>
  </form>
</main>

<!-- ============ Chat ============ -->
<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Room">
    <header>
      <div class="brand"><span class="logo" aria-hidden="true">💬</span> Chat Room</div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
    </header>
    <h2><span>Online</span><span id="count">0</span></h2>
    <ul class="users" id="users"></ul>
    <footer>
      <button class="ghost" id="themeBtn" type="button" title="Switch light/dark">Theme</button>
      <button class="ghost" id="leaveBtn" type="button">Leave</button>
    </footer>
  </aside>

  <section class="main">
    <div class="topbar">
      <button class="ghost" id="menuBtn" type="button" style="flex:none" aria-label="Show who is online">👥 <span id="count2">0</span></button>
      <span id="statusText2" style="color:var(--muted);font-size:13px"></span>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Messages"></div>
    <div class="composer">
      <form id="sendForm" autocomplete="off">
        <input id="msgInput" maxlength="4000" placeholder="Type a message…" aria-label="Message" disabled>
        <button class="send" id="sendBtn" type="submit" disabled>Send</button>
      </form>
      <p class="hint">Commands: <kbd>/users</kbd> <kbd>/help</kbd> <kbd>/quit</kbd></p>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const el = {
    login: $('#login'), loginForm: $('#loginForm'), nameInput: $('#nameInput'), joinBtn: $('#joinBtn'),
    loginError: $('#loginError'), app: $('#app'), users: $('#users'), count: $('#count'), count2: $('#count2'),
    dot: $('#dot'), statusText: $('#statusText'), statusText2: $('#statusText2'), banner: $('#banner'),
    messages: $('#messages'), sendForm: $('#sendForm'), msgInput: $('#msgInput'), sendBtn: $('#sendBtn'),
    leaveBtn: $('#leaveBtn'), themeBtn: $('#themeBtn'), menuBtn: $('#menuBtn'),
  };

  const MAX_RETRIES = 10;
  let ws = null, me = '', wantedName = '', joined = false, retries = 0, retryTimer = null;
  let ended = false, leaving = false, lastSender = null;

  // ----- small helpers -----
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode etc. */ } },
  };
  const hue = (name) => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const hhmm = () => new Date().toTimeString().slice(0, 5);

  function setStatus(kind, text) {
    el.dot.className = 'dot ' + kind;
    el.statusText.textContent = text;
    el.statusText2.textContent = text;
    const live = kind === 'on';
    el.msgInput.disabled = !live;
    el.sendBtn.disabled = !live;
    if (live) el.msgInput.focus();
  }
  function showBanner(text, bad, actionLabel, action) {
    el.banner.hidden = !text;
    el.banner.className = 'banner' + (bad ? ' bad' : '');
    el.banner.textContent = text || '';
    if (text && actionLabel) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = actionLabel; b.onclick = action;
      el.banner.append(b);
    }
  }

  // ----- rendering -----
  function nearBottom() {
    const m = el.messages;
    return m.scrollHeight - m.scrollTop - m.clientHeight < 80;
  }
  function push(node) {
    const stick = nearBottom();
    el.messages.append(node);
    if (stick) el.messages.scrollTop = el.messages.scrollHeight;
  }
  function addSystem(text) {
    lastSender = null;
    const d = document.createElement('div');
    d.className = 'sys'; d.textContent = text;
    push(d);
  }
  function addChat(sender, time, text, own) {
    const row = document.createElement('div');
    const isServer = sender === 'Server' && !own;
    row.className = 'row' + (own ? ' own' : '') + (isServer ? ' server' : '');
    row.style.setProperty('--h', hue(sender));
    if (lastSender !== sender) {
      row.classList.add('first');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const b = document.createElement('b'); b.textContent = own ? 'You' : sender;
      const t = document.createElement('span'); t.textContent = time;
      meta.append(b, t);
      row.append(meta);
    }
    lastSender = sender;
    const bubble = document.createElement('div');
    bubble.className = 'bubble'; bubble.textContent = text;   // textContent: message text is never HTML
    row.append(bubble);
    push(row);
  }
  const CHAT_RE = /^\[(\d{2}:\d{2})\] ([^\n]*?): ([\s\S]*)$/;
  function addIncoming(text) {
    const m = CHAT_RE.exec(text);
    if (m) addChat(m[2], m[1], m[3], false); else addSystem(text);
  }
  function renderUsers(list) {
    el.users.replaceChildren();
    for (const name of list) {
      const li = document.createElement('li');
      const av = document.createElement('span');
      av.className = 'avatar'; av.style.setProperty('--h', hue(name));
      av.textContent = (Array.from(name)[0] || '?').toUpperCase();
      const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = name;
      li.append(av, nm);
      if (name === me) { const y = document.createElement('span'); y.className = 'you'; y.textContent = '(you)'; li.append(y); }
      el.users.append(li);
    }
    el.count.textContent = el.count2.textContent = String(list.length);
  }

  // ----- connection -----
  function connect() {
    clearTimeout(retryTimer);
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    const mine = ws;
    mine.onopen = () => mine.send(JSON.stringify({ type: 'join', name: wantedName }));
    mine.onmessage = (e) => { if (mine === ws) onMessage(JSON.parse(e.data)); };
    mine.onclose = () => { if (mine === ws) onClosed(); };
  }

  function onMessage(m) {
    switch (m.type) {
      case 'welcome': {
        const first = !joined;
        me = m.name; joined = true; retries = 0;
        store.set('chat-name', wantedName);
        el.login.hidden = true; el.app.hidden = false;
        showBanner('');
        setStatus('on', 'Connected as ' + me);
        if (first) { el.messages.replaceChildren(); lastSender = null; }
        addSystem(first ? m.text : 'Reconnected as ' + me + '.');
        break;
      }
      case 'users': renderUsers(m.list); break;
      case 'msg': addIncoming(m.text); break;
      case 'ended':
        ended = true;
        setStatus('off', 'Server ended the chat');
        showBanner('The server ended the chat.', true, 'Join again', rejoin);
        break;
      case 'lost': break;                       // the socket close that follows drives the reconnect
      case 'error':
        if (!joined) { failLogin(m.text); } break;
    }
  }

  function onClosed() {
    if (leaving || ended) return;
    if (!joined) { failLogin('Could not connect to the chat bridge. Is bridge.py running?'); return; }
    scheduleRetry();
  }

  function scheduleRetry() {
    if (retries >= MAX_RETRIES) {
      setStatus('off', 'Disconnected');
      showBanner('Could not reconnect.', true, 'Try again', () => { retries = 0; scheduleRetry(); });
      return;
    }
    retries++;
    const delay = Math.min(2000 * retries, 10000);
    setStatus('wait', 'Reconnecting…');
    showBanner(`Connection lost. Reconnecting in ${delay / 1000}s (attempt ${retries}/${MAX_RETRIES})…`);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, delay);
  }

  function failLogin(text) {
    leaving = true; ws && ws.close(); leaving = false; joined = false;
    el.loginError.textContent = text;
    el.joinBtn.disabled = false; el.joinBtn.textContent = 'Join';
  }

  function rejoin() { ended = false; retries = 0; showBanner(''); setStatus('wait', 'Connecting…'); connect(); }

  function leave() {
    leaving = true; clearTimeout(retryTimer);
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'leave' }));
    ws && ws.close();
    joined = false; ended = false; me = ''; lastSender = null;
    el.app.hidden = true; el.login.hidden = false;
    el.joinBtn.disabled = false; el.joinBtn.textContent = 'Join'; el.loginError.textContent = '';
    renderUsers([]); el.nameInput.focus();
    leaving = false;
  }

  // ----- events -----
  el.loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = el.nameInput.value.trim();
    if (!name) { el.loginError.textContent = 'Please type a name.'; return; }
    wantedName = name; ended = false; retries = 0;
    el.loginError.textContent = '';
    el.joinBtn.disabled = true; el.joinBtn.textContent = 'Joining…';
    connect();
  });

  el.sendForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = el.msgInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    el.msgInput.value = '';
    if (text === '/quit' || text === 'exit') { leave(); return; }
    ws.send(JSON.stringify({ type: 'send', text }));
    if (!text.startsWith('/')) addChat(me, hhmm(), text, true);   // the server doesn't echo to the sender
  });

  el.leaveBtn.addEventListener('click', leave);
  el.menuBtn.addEventListener('click', () => el.app.classList.toggle('open'));
  el.messages.addEventListener('click', () => el.app.classList.remove('open'));
  el.app.addEventListener('click', (e) => { if (e.target === el.app) el.app.classList.remove('open'); });

  el.themeBtn.addEventListener('click', () => {
    const dark = getComputedStyle(document.body).backgroundColor.match(/\d+/g).map(Number).reduce((a, b) => a + b, 0) < 300;
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set('chat-theme', next);
  });

  const savedTheme = store.get('chat-theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  const savedName = store.get('chat-name');
  if (savedName) el.nameInput.value = savedName;
})();
</script>
</body>
</html>
